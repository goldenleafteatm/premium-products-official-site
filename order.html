<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order | Golden Leaf</title>

<link rel="stylesheet" href="assets/css/style.css">

  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<nav class="navbar">

<div class="brand">
Golden Leaf
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="products.html">Products</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<section class="order-section">

<h1>Begin Your Order</h1>

<div class="gold-line"></div>

<p class="order-intro">

Select your preferred tea and
share your details with us.

Our team will personally contact
you to confirm your order.

</p>
  
<form
action="FORM_ENDPOINT_HERE"
method="POST"
class="order-form">

<input
type="hidden"
name="_next"
value="thank-you.html">

<label>
<i class="fa-solid fa-leaf"></i>
Select Product
</label>

<select name="Product" required>

<option value="">
Choose a Product
</option>

<option value="Origin Black">
Origin Black
</option>

<option value="Misty Green">
Misty Green
</option>

<option value="Morning Mist">
Morning Mist
</option>

<option value="Ela Gold">
Ela Gold
</option>

</select>
  
<label>
<i class="fa-solid fa-user"></i>
Full Name
</label>
  
<input
type="text"
name="Name"
placeholder="Your Name"
required>

<label>
<i class="fa-solid fa-phone"></i>
Phone Number
</label>

<input
type="tel"
name="Phone"
placeholder="Your Phone Number"
required>

<label>
<i class="fa-solid fa-location-dot"></i>
City / Place
</label>

<input
type="text"
name="Place"
placeholder="Your City"
required>

<label>
<i class="fa-solid fa-house"></i>
Address
</label>

<textarea
name="Address"
rows="4"
placeholder="Your Address"
required></textarea>

<label>
<i class="fa-solid fa-box"></i>
Quantity
</label>

<input
type="number"
name="Quantity"
min="1"
value="1"
required>

<label>
<i class="fa-solid fa-pen"></i>
Additional Notes
</label>

<textarea
name="Notes"
rows="4"
placeholder="Anything you'd like us to know?"></textarea>

  <p class="trust-message">

Your information is used only
to process your order and contact you.

</p>

<button
type="submit"
class="btn">

Place Order

</button>

</form>

</section>

</body>

</html>
