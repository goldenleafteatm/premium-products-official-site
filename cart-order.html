<section class="order-section">

<h1>Begin Your Order</h1>

<div class="gold-line"></div>

<p class="order-intro">

Select your preferred tea and
share your details with us.

Our team will personally contact
you to confirm your order.

</p>
  
 <form action="https://formspree.io/f/xnjynwlg" method="POST" onsubmit="return redirectAfterSubmit()">

<div class="form-grid">

  <div class="form-group">
    
   <div class="cart-order-summary">

    <h3>
        <i class="fa-solid fa-bag-shopping"></i>
        Your Order
    </h3>

    <div id="cart-order-items"></div>

    <div class="cart-order-total">
        <span>Total</span>
        <strong id="cart-order-total">₹0</strong>
    </div>

</div>

<input type="hidden" name="Order Details" id="cart-order-details">
<input type="hidden" name="Order Total" id="cart-order-total-input">
    
  </div>

  <div class="form-group">
    <label><i class="fa-solid fa-user"></i> Full Name</label>
    <input type="text" name="Name" placeholder="Your Name" required>
  </div>

  <div class="form-group">
    <label><i class="fa-solid fa-phone"></i> Phone Number</label>
    <input type="tel" name="Phone" placeholder="Your Phone Number" required>
  </div>

  <div class="form-group">
    <label><i class="fa-solid fa-location-dot"></i> City / Place</label>
    <input type="text" name="Place" placeholder="Your City" required>
  </div>

  <div class="form-group full">
    <label><i class="fa-solid fa-house"></i> Address</label>
    <textarea name="Address" rows="4" placeholder="Your Address" required></textarea>
  </div>

  <div class="form-group">
    <label><i class="fa-solid fa-box"></i> Quantity</label>
    <input type="number" name="Quantity" min="1" value="1" required>
  </div>

  <div class="form-group full">
    <label><i class="fa-solid fa-pen"></i> Additional Notes</label>
    <textarea name="Notes" rows="4" placeholder="Anything you'd like us to know?"></textarea>
  </div>

  <div class="form-group full">
    <p class="trust-message">
      Your information is used only to process your order and contact you.
    </p>
  </div>

  <div class="form-group full">
    <button type="submit" class="btn">Place Order</button>
  </div>

</div>

</form>
  
</section>

  <i class="fa-brands fa-whatsapp"></i>
</a>
  
  <script src="assets/js/main.js"></script>

  <script>
document.addEventListener("DOMContentLoaded", function () {

    const orderItems = document.getElementById("cart-order-items");
    const orderTotal = document.getElementById("cart-order-total");
    const orderDetails = document.getElementById("cart-order-details");
    const orderTotalInput = document.getElementById("cart-order-total-input");

    let cart = JSON.parse(localStorage.getItem("goldenLeafCart")) || [];

    if (cart.length === 0) {

        orderItems.innerHTML = `
            <p>Your cart is empty.</p>
            <a href="products.html" class="btn">
                Explore Our Teas
            </a>
        `;

        orderTotal.textContent = "₹0";
        return;
    }

    let total = 0;
    let details = [];

    cart.forEach(function (item) {

        const itemTotal = item.price * item.quantity;

        total += itemTotal;

        details.push(
            item.name + " × " + item.quantity + " = ₹" + itemTotal
        );

        orderItems.innerHTML += `
            <div class="cart-order-item">

                <span>
                    ${item.name} × ${item.quantity}
                </span>

                <strong>
                    ₹${itemTotal}
                </strong>

            </div>
        `;
    });

    orderTotal.textContent = "₹" + total;

    orderDetails.value = details.join(" | ");

    orderTotalInput.value = "₹" + total;

});
</script>
  
</body>
